<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilz-Fundlog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f6f3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fundlog">
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --card:#f3f3f0; --line:#d6d6d0; --acc:#2f6f3e; --accfg:#fff; --bad:#a33; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#eee; --muted:#9a9a9a; --card:#1e1e1e; --line:#333; --acc:#4c9a5e; --accfg:#06140a; --bad:#e07070; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; max-width:560px; margin-inline:auto; }
  h1 { font-size:1.3rem; margin:0 0 12px; }
  label { display:block; margin:12px 0 4px; font-weight:600; }
  input, select, textarea { width:100%; padding:12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  button { padding:14px; font-size:1rem; border:0; border-radius:8px; background:var(--acc); color:var(--accfg); font-weight:600; width:100%; margin-top:12px; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  button.small { width:auto; padding:6px 10px; margin:0; font-size:.85rem; background:transparent; color:var(--bad); border:1px solid var(--line); }
  button.small.edit { color:var(--fg); }
  .btns { display:flex; gap:6px; flex-shrink:0; }
  .choice { display:flex; gap:8px; }
  .choice label { flex:1; margin:0; font-weight:400; }
  .choice input { display:none; }
  .choice span { display:block; text-align:center; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .choice input:checked + span { background:var(--acc); color:var(--accfg); font-weight:600; }
  .msg { margin-top:8px; font-size:.9rem; color:var(--muted); min-height:1.2em; }
  .entry { border-top:1px solid var(--line); padding:10px 0; display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .entry small { color:var(--muted); display:block; }
  h2 { font-size:1.05rem; margin:24px 0 4px; }
  .info { white-space:pre-line; font-size:.9rem; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:8px; }
  textarea.out { height:90px; font-family:monospace; font-size:.8rem; display:none; margin-top:8px; }
</style>
</head>
<body>
<h1>Pilz-Fundlog</h1>

<label for="datum">Datum</label>
<input id="datum" type="date">

<label>Standort</label>
<div class="row">
  <input id="lat" inputmode="decimal" placeholder="Breite 48.7011">
  <input id="lon" inputmode="decimal" placeholder="Länge 8.5967">
</div>
<button class="sec" id="gps" type="button">GPS-Position holen</button>
<div class="msg" id="gpsmsg"></div>

<label for="art">Gesuchte Art</label>
<select id="art">
  <option value="steinpilz">Steinpilz</option>
  <option value="pfifferling">Pfifferling</option>
  <option value="maronenroehrling">Maronenröhrling</option>
  <option value="champignon">Wiesenchampignon</option>
  <option value="rotkappe">Rotkappe/Birkenpilz</option>
  <option value="semmelstoppelpilz">Semmelstoppelpilz</option>
  <option value="herbsttrompete">Herbsttrompete</option>
  <option value="parasol">Parasol</option>
  <option value="hallimasch">Hallimasch</option>
  <option value="fliegenpilz">Fliegenpilz</option>
  <option value="hexenroehrling">Hexenröhrling</option>
  <option value="perlpilz">Perlpilz</option>
  <option value="habichtspilz">Habichtspilz</option>
  <option value="reizker">Reizker</option>
  <option value="krause_glucke">Krause Glucke</option>
</select>

<label>Ergebnis</label>
<div class="choice">
  <label><input type="radio" name="fund" value="ja" checked><span>Fund</span></label>
  <label><input type="radio" name="fund" value="nein"><span>Kein Fund</span></label>
</div>

<label for="menge">Menge (optional)</label>
<input id="menge" placeholder="z. B. 5 Stück">

<label for="notiz">Notiz (optional)</label>
<input id="notiz" placeholder="z. B. Fichtenwald, Nordhang">

<button id="save" type="button">Eintrag speichern</button>
<button class="sec" id="cancel" type="button" style="display:none">Bearbeiten abbrechen</button>
<div class="msg" id="msg"></div>

<h2>Einträge (<span id="count">0</span>)</h2>
<div id="list"></div>

<button class="sec" id="dl" type="button">CSV herunterladen</button>
<button class="sec" id="copy" type="button">CSV kopieren</button>
<textarea class="out" id="out" readonly></textarea>
<div class="msg">Die Einträge liegen nur in diesem Browser auf diesem Handy. Lade die CSV regelmäßig herunter, sonst gehen sie bei gelöschten Browserdaten verloren.</div>

<h2>Lernstand</h2>
<div class="info" id="learn">Noch keine Daten.</div>
<button class="sec" id="syncbtn" type="button">Wetter laden und Lernstand aktualisieren</button>
<button class="sec" id="dlj" type="button" style="display:none">gelernt.json herunterladen</button>

<h2>Prognose</h2>
<button class="sec" id="prog" type="button">Prognose für diesen Standort</button>
<div class="info" id="progout" style="display:none"></div>

<script src="engine.js"></script>
<script>
const KEY = "pilz_eintraege_v1";
const $ = id => document.getElementById(id);
let editIdx = null;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
}
function store(arr) {
  try { localStorage.setItem(KEY, JSON.stringify(arr)); return true; } catch (e) { return false; }
}
function today() {
  const t = new Date();
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}
function num(v) {
  const n = parseFloat(String(v).trim().replace(",", "."));
  return isNaN(n) ? null : n;
}
function esc(v) {
  v = String(v == null ? "" : v);
  return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function toCsv(arr) {
  const lines = ["datum,lat,lon,art,fund,menge,notiz"];
  arr.forEach(e => lines.push([e.datum, e.lat, e.lon, e.art, e.fund, e.menge, e.notiz].map(esc).join(",")));
  return lines.join("\n") + "\n";
}
function startEdit(idx) {
  const e = load()[idx];
  if (!e) return;
  editIdx = idx;
  $("datum").value = e.datum;
  $("lat").value = e.lat;
  $("lon").value = e.lon;
  $("art").value = e.art;
  const r = document.querySelector('input[name="fund"][value="' + e.fund + '"]');
  if (r) r.checked = true;
  $("menge").value = e.menge || "";
  $("notiz").value = e.notiz || "";
  $("save").textContent = "Änderung speichern";
  $("cancel").style.display = "block";
  $("msg").textContent = "Du bearbeitest einen gespeicherten Eintrag.";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function endEdit() {
  editIdx = null;
  $("save").textContent = "Eintrag speichern";
  $("cancel").style.display = "none";
}

function render() {
  const arr = load();
  $("count").textContent = arr.length;
  $("list").innerHTML = "";
  arr.slice().reverse().forEach((e, i) => {
    const idx = arr.length - 1 - i;
    const div = document.createElement("div");
    div.className = "entry";
    const info = document.createElement("div");
    const art = $("art").querySelector('option[value="' + e.art + '"]');
    info.textContent = e.datum + " – " + (art ? art.textContent : e.art) + " – " + (e.fund === "ja" ? "Fund" : "kein Fund");
    const sm = document.createElement("small");
    sm.textContent = e.lat + ", " + e.lon + (e.menge ? " · " + e.menge : "") + (e.notiz ? " · " + e.notiz : "");
    info.appendChild(sm);
    const be = document.createElement("button");
    be.className = "small edit"; be.textContent = "Bearbeiten";
    be.onclick = () => startEdit(idx);
    const b = document.createElement("button");
    b.className = "small"; b.textContent = "Löschen";
    b.onclick = () => {
      if (confirm("Eintrag löschen?")) { endEdit(); const a = load(); a.splice(idx, 1); store(a); render(); }
    };
    const btns = document.createElement("div");
    btns.className = "btns";
    btns.appendChild(be); btns.appendChild(b);
    div.appendChild(info); div.appendChild(btns);
    $("list").appendChild(div);
  });
  renderLearn();
}

$("datum").value = today();

// Koordinaten aus Karten-App einfügen ("48.7011, 8.5967" in das erste Feld)
$("lat").addEventListener("input", () => {
  const m = $("lat").value.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);
  if (m) { $("lat").value = m[1]; $("lon").value = m[2]; }
});

$("gps").onclick = () => {
  const msg = $("gpsmsg");
  if (!navigator.geolocation) { msg.textContent = "GPS nicht verfügbar. Koordinaten aus der Karten-App einfügen."; return; }
  msg.textContent = "Suche Position …";
  navigator.geolocation.getCurrentPosition(
    p => {
      $("lat").value = p.coords.latitude.toFixed(4);
      $("lon").value = p.coords.longitude.toFixed(4);
      msg.textContent = "Position übernommen (Genauigkeit ca. " + Math.round(p.coords.accuracy) + " m).";
    },
    () => { msg.textContent = "GPS nicht verfügbar oder nicht erlaubt. Koordinaten aus der Karten-App einfügen."; },
    { enableHighAccuracy: true, timeout: 20000 }
  );
};

$("save").onclick = () => {
  const lat = num($("lat").value), lon = num($("lon").value);
  if (lat === null || lon === null) { $("msg").textContent = "Bitte Standort angeben."; return; }
  if (!$("datum").value) { $("msg").textContent = "Bitte Datum angeben."; return; }
  const e = {
    datum: $("datum").value,
    lat: lat.toFixed(4), lon: lon.toFixed(4),
    art: $("art").value,
    fund: document.querySelector('input[name="fund"]:checked').value,
    menge: $("menge").value.trim(),
    notiz: $("notiz").value.trim()
  };
  const arr = load();
  const wasEdit = editIdx !== null && editIdx < arr.length;
  if (wasEdit) {
    const old = arr[editIdx];
    if (old.wx && old.datum === e.datum && old.lat === e.lat && old.lon === e.lon) { e.wx = old.wx; e.wxFinal = old.wxFinal; }
    arr[editIdx] = e;
  } else arr.push(e);
  if (store(arr)) {
    $("msg").textContent = wasEdit ? "Änderung gespeichert." : "Gespeichert.";
    $("menge").value = ""; $("notiz").value = "";
    endEdit();
    render();
    sync();
  } else {
    $("msg").textContent = "Speichern im Browser nicht möglich. Bitte CSV kopieren und woanders sichern.";
  }
};

$("cancel").onclick = () => {
  endEdit();
  $("menge").value = ""; $("notiz").value = "";
  $("msg").textContent = "Bearbeiten abgebrochen.";
};

$("dl").onclick = () => {
  const blob = new Blob([toCsv(load())], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fundlog.csv";
  document.body.appendChild(a); a.click(); a.remove();
};

$("copy").onclick = () => {
  const out = $("out");
  out.value = toCsv(load());
  out.style.display = "block";
  out.select();
  try { document.execCommand("copy"); } catch (e) {}
};

// ---------- Wetter automatisch laden und lernen ----------
let syncing = false;
let lastLearn = null;
const CRIT_NAMES = { rain_window: "Regen", soil_temp: "Bodentemp.", night_min: "Nachtminimum", humidity: "Luftfeuchte", frost: "Frost" };

function needsWx(e, t) {
  if (e.datum > t) return false;
  return !e.wx || (!e.wxFinal && daysBetween(e.datum, t) > 7);
}

async function sync() {
  if (syncing || typeof fetchHistoryWx !== "function") return;
  syncing = true;
  try {
    const t = today();
    const need = [];
    load().forEach((e, i) => { if (needsWx(e, t)) need.push(i); });
    if (need.length && navigator.onLine !== false) {
      let done = 0;
      for (const i of need) {
        $("learn").textContent = "Lade Wetter " + (done + 1) + "/" + need.length + " …";
        try {
          const e = load()[i];
          if (!e || !needsWx(e, t)) continue;
          const res = await fetchHistoryWx(num(e.lat), num(e.lon), e.datum, t);
          const arr = load();
          const cur = arr[i];
          if (cur && cur.datum === e.datum && cur.lat === e.lat && cur.lon === e.lon) {
            cur.wx = res.wx; cur.wxFinal = res.final; store(arr);
          }
          done++;
        } catch (err) { break; }   // offline oder Fehler: beim naechsten Mal wieder versuchen
      }
    }
  } finally {
    syncing = false;
    renderLearn();
  }
}

function renderLearn() {
  const box = $("learn");
  if (typeof learn !== "function") { box.textContent = "engine.js fehlt. Bitte die Datei mit ins Repo hochladen."; return; }
  if (syncing) return;
  const t = today();
  const arr = load();
  const pending = arr.filter(e => needsWx(e, t)).length;
  const res = learn(arr.filter(e => e.wx));
  lastLearn = res;
  const lines = [];
  lines.push("Einträge: " + arr.length + (pending ? " · Wetter ausstehend: " + pending + " (wird mit Internet geladen)" : " · Wetter geladen"));
  lines.push("Tage/Orte: " + res.n + " (Fund-Tage " + res.nFind + ", ohne Fund " + res.nNo + ")");
  if (!res.ok) {
    lines.push(res.reason === "aehnlich"
      ? "Die Wetterwerte der Tage sind zu ähnlich, daraus lässt sich noch nichts lernen. Startwerte gelten."
      : "Noch zu wenig Daten zum Lernen (mind. " + MIN_EACH + " Fund-Tage und " + MIN_EACH + " Tage ohne Fund). Startwerte gelten.");
  } else {
    lines.push("Lernanteil: " + Math.round(res.share * 100) + " % (Start → neu)");
    CRIT.forEach(k => {
      lines.push(CRIT_NAMES[k] + ": " + START_WEIGHTS[k].toFixed(2) + " → " + res.weights[k].toFixed(2));
    });
    if (res.auc0 != null) lines.push("Trennschärfe der Startwerte (AUC, 0,5 = Zufall): " + res.auc0.toFixed(2));
  }
  box.textContent = lines.join("\n");
  $("dlj").style.display = res.ok ? "block" : "none";
}

$("syncbtn").onclick = () => { sync(); };
window.addEventListener("online", () => { sync(); });

$("dlj").onclick = () => {
  if (!lastLearn || !lastLearn.ok) return;
  const w = {};
  CRIT.forEach(k => { w[k] = Math.round(lastLearn.weights[k] * 10000) / 10000; });
  const obj = { stand: today(), tage: lastLearn.n, fund_tage: lastLearn.nFind, ohne_fund_tage: lastLearn.nNo,
                lernanteil: Math.round(lastLearn.share * 100) / 100, weights: w };
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gelernt.json";
  document.body.appendChild(a); a.click(); a.remove();
};

$("prog").onclick = async () => {
  const out = $("progout");
  const lat = num($("lat").value), lon = num($("lon").value);
  out.style.display = "block";
  if (lat === null || lon === null) { out.textContent = "Bitte oben einen Standort angeben (Breite und Länge)."; return; }
  if (typeof fetchForecastWx !== "function") { out.textContent = "engine.js fehlt."; return; }
  out.textContent = "Lade Wetter …";
  try {
    const wx = await fetchForecastWx(lat, lon);
    const t = today();
    const idx = wx.time.indexOf(t);
    const sum = (a, b) => wx.precip.slice(a, b).reduce((s, v) => s + (v || 0), 0);
    const learned = lastLearn && lastLearn.ok;
    const weights = learned ? lastLearn.weights : START_WEIGHTS;
    const res = Object.keys(SPECIES).map(k => evaluate(wx, k, t, weights)).filter(Boolean).sort((a, b) => b.score - a.score);
    const lines = [
      "Regen letzte 7 Tage: " + sum(Math.max(0, idx - 6), idx + 1).toFixed(0) + " mm · nächste 3 Tage: " + sum(idx + 1, idx + 4).toFixed(0) + " mm",
      learned ? "Gewichte: gelernt (Lernanteil " + Math.round(lastLearn.share * 100) + " %)" : "Gewichte: Startwerte",
      ""
    ];
    res.forEach(r => {
      const opt = $("art").querySelector('option[value="' + r.key + '"]');
      lines.push(r.score + " · " + scoreLabel(r.score) + " · " + (opt ? opt.textContent : r.key) + (r.inSeason ? "" : " (außerhalb der Saison)"));
    });
    out.textContent = lines.join("\n");
  } catch (err) {
    out.textContent = "Wetter konnte nicht geladen werden (offline?). Bitte mit Internet erneut versuchen.";
  }
};

// Offline-Zwischenspeicher und Schutz vor automatischem Loeschen (nur ueber https)
try {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
} catch (e) {}

render();
sync();
</script>
</body>
</html>
